name: validate-reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.3.3'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Verify archived release integrity
        run: python scripts/verify_release.py
      - name: Python unit tests
        run: python tests/test_reference.py
      - name: R unit tests
        run: Rscript tests/test_model.R
      - name: Cross-language validation
        run: |
          Rscript analysis/run_r_grid.R /tmp/r_grid.csv
          python analysis/run_python_grid.py /tmp/python_grid.csv
          python tests/compare_implementations.py /tmp/r_grid.csv /tmp/python_grid.csv
      - name: Symbolic checks
        run: python model/verify_symbolic.py
      - name: Reproduce and numerically verify full synthetic analysis
        run: python scripts/verify_reproduction.py
