name: validate-reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Python unit tests
        run: python tests/test_reference.py
      - name: R unit tests
        run: Rscript tests/test_model.R
      - name: Cross-language validation
        run: |
          Rscript analysis/run_r_grid.R /tmp/r_grid.csv
          python analysis/run_python_grid.py /tmp/python_grid.csv
          python tests/compare_implementations.py /tmp/r_grid.csv /tmp/python_grid.csv
      - name: Symbolic checks
        run: python model/verify_symbolic.py
      - name: Reproduce full synthetic analysis
        run: python analysis/run_analysis.py
      - name: Verify frozen results
        run: python scripts/verify_frozen_results.py
